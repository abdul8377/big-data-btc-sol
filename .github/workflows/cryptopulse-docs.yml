name: CryptoPulse · Documentación MkDocs

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/cryptopulse-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/cryptopulse-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Instalar MkDocs Material
        run: pip install -r site/requirements.txt
      - name: Compilar el sitio
        run: mkdocs build --strict -f site/mkdocs.yml
      - name: Preparar artefacto de Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    name: Publicar GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
