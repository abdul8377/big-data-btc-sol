<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="410" viewBox="0 0 1240 410" role="img"><title>Cronología de evaluación</title><desc>Entrenamiento 2022-2024, calibración enero-agosto2025, selección septiembre-diciembre2025 y test2026</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#62cddd"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#101c30"/><text x="38" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#ffffff" font-weight="700">Separar pasado, selección y prueba</text><text x="38" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#dce9f7" font-weight="400">Etiquetas futuras fuera de las variables · muestreo histórico cada 15 minutos</text><rect x="38" y="132" width="320" height="120" rx="12" fill="#182a43" stroke="#62cddd" stroke-opacity=".6"/><text x="54" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#62cddd" font-weight="650">Entrenamiento</text><text x="54" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#dce9f7" font-weight="400">2022–2024</text><text x="54" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#dce9f7" font-weight="400">Aprender modelos y percentiles</text><rect x="378" y="132" width="260" height="120" rx="12" fill="#182a43" stroke="#bca7ff" stroke-opacity=".6"/><text x="394" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#bca7ff" font-weight="650">Calibración</text><text x="394" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#dce9f7" font-weight="400">Enero–agosto 2025</text><text x="394" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#dce9f7" font-weight="400">Ajustar probabilidades</text><rect x="658" y="132" width="250" height="120" rx="12" fill="#182a43" stroke="#fbbf24" stroke-opacity=".6"/><text x="674" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#fbbf24" font-weight="650">Selección</text><text x="674" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#dce9f7" font-weight="400">Septiembre–diciembre 2025</text><text x="674" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#dce9f7" font-weight="400">Método y corte de alerta</text><rect x="928" y="132" width="274" height="120" rx="12" fill="#182a43" stroke="#81d49b" stroke-opacity=".6"/><text x="944" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#81d49b" font-weight="650">Test reservado</text><text x="944" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#dce9f7" font-weight="400">Enero–septiembre 2026</text><text x="944" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#dce9f7" font-weight="400">Evaluar la elección final</text><text x="38" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#dce9f7" font-weight="400">Embargo de 30 min en fronteras para que las etiquetas no crucen al período siguiente.</text><text x="38" y="343" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#9dafc4" font-weight="400">El test no elige el modelo. En vivo: una actualización por minuto y resultados tras 5/15/30 min.</text></svg>