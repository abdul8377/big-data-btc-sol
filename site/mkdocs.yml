site_name: CryptoPulse | Big Data BTC & SOL
site_description: Plataforma Big Data para análisis de riesgo de BTC y SOL con Spark,
  Kafka y Grafana.
site_author: Equipo CryptoPulse
site_url: https://abdul8377.github.io/big-data-btc-sol/
repo_name: abdul8377/big-data-btc-sol
repo_url: https://github.com/abdul8377/big-data-btc-sol
edit_uri: edit/main/site/docs/
docs_dir: docs
site_dir: build
theme:
  name: material
  language: es
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - navigation.path
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.tabs.link
  palette:
  - scheme: slate
    primary: indigo
    accent: cyan
    toggle:
      icon: material/weather-sunny
      name: Cambiar a modo claro
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-night
      name: Cambiar a modo oscuro
  font:
    text: Inter
    code: JetBrains Mono
nav:
- Inicio: index.md
- El proyecto:
  - Brief: brief.md
  - Arquitectura: arquitectura.md
  - Herramientas: herramientas.md
  - Pipeline y datos: pipeline.md
  - Modelos y métricas: modelos.md
- Producto U2:
  - Entrega S06–S12: u2-producto.md
  - Base de Unidad I: u1-producto.md
  - Bitácora S01–S12: sesiones.md
- Operación y evidencia:
  - Grafana panel por panel: dashboard.md
  - Prometheus y salud: observabilidad.md
  - Galería y pruebas: evidencias.md
  - Ejecución local: ejecucion.md
- Referencia:
  - Límites y mantenimiento: limites.md
  - Glosario: glosario.md
  - Próxima unidad: u3-producto.md
plugins:
- search:
    lang: es
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
extra_css:
- assets/stylesheets/extra.css
copyright: © 2026 · CryptoPulse · Proyecto académico Big Data
