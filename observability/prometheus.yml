global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: cryptopulse
    scrape_timeout: 12s
    static_configs:
      - targets: [exporter:8000]
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
